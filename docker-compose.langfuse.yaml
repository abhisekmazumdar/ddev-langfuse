#ddev-generated
# Langfuse (https://langfuse.com) self-hosted stack for DDEV.
#
# Because this file lives in the project's .ddev/ directory, DDEV starts
# these services on the SAME docker network as the project's other
# containers (web, db, etc). That means the Drupal "web" container can
# reach Langfuse by plain service hostname -- no host.docker.internal,
# no manual `docker network connect`:
#
#   http://langfuse-web:3000
#
# Secrets and the headless-bootstrap admin/API-key values are generated
# once at install time into .ddev/.env.langfuse (gitignored) -- see
# install.yaml and README.md.

services:

  langfuse-web:
    image: ${LANGFUSE_WEB_IMAGE:-langfuse/langfuse:4}
    container_name: ddev-${DDEV_SITENAME}-langfuse-web
    hostname: langfuse-web
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    env_file:
      - .env.langfuse
    environment:
      # Next.js's standalone server binds to $HOSTNAME if set, and Docker
      # auto-populates that from the `hostname:` field above -- which
      # resolves to this container's own IP, not 0.0.0.0/localhost. Without
      # this override, the healthcheck's `wget http://localhost:3000` gets
      # "connection refused" forever even once the app is fully up.
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://langfuse:${POSTGRES_PASSWORD}@langfuse-postgres:5432/langfuse
      - NEXTAUTH_URL=http://langfuse-web:3000
      - LANGFUSE_CSP_ENFORCE_HTTPS=false
      - CLICKHOUSE_MIGRATION_URL=clickhouse://langfuse-clickhouse:9000
      - CLICKHOUSE_URL=http://langfuse-clickhouse:8123
      - CLICKHOUSE_USER=langfuse
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=langfuse
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media/
      - LANGFUSE_USE_AZURE_BLOB=false
      - REDIS_CONNECTION_STRING=redis://default:${REDIS_AUTH}@langfuse-redis:6379
      - TELEMETRY_ENABLED=false
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=true
      # VIRTUAL_HOST/HTTP(S)_EXPOSE hook this service into ddev-router so it's
      # reachable from the host browser at https://<project>.ddev.site:3443
      # (or :3000 over plain http) -- see commands/host/langfuse.
      - VIRTUAL_HOST=${DDEV_HOSTNAME}
      - HTTP_EXPOSE=3000:3000
      - HTTPS_EXPOSE=3443:3000
    healthcheck:
      # 127.0.0.1, not localhost -- this image's /etc/hosts resolves
      # "localhost" to ::1 only, and the server listens IPv4-only.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ".:/mnt/ddev_config"
      - "ddev-global-cache:/mnt/ddev-global-cache"
    x-ddev:
      describe-info: |
        Web UI: http://langfuse-web:3000 (internal) / ddev launch :3000 (host)
        Login and API keys: ddev langfuse-credentials

  langfuse-worker:
    image: ${LANGFUSE_WORKER_IMAGE:-langfuse/langfuse-worker:4}
    container_name: ddev-${DDEV_SITENAME}-langfuse-worker
    hostname: langfuse-worker
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    env_file:
      - .env.langfuse
    environment:
      # See the matching HOSTNAME note on langfuse-web above -- the worker's
      # HTTP health-check server has the same bind-to-$HOSTNAME behavior.
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://langfuse:${POSTGRES_PASSWORD}@langfuse-postgres:5432/langfuse
      - CLICKHOUSE_MIGRATION_URL=clickhouse://langfuse-clickhouse:9000
      - CLICKHOUSE_URL=http://langfuse-clickhouse:8123
      - CLICKHOUSE_USER=langfuse
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=langfuse
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media/
      - REDIS_CONNECTION_STRING=redis://default:${REDIS_AUTH}@langfuse-redis:6379
      - TELEMETRY_ENABLED=false
    expose:
      - "3030"
    healthcheck:
      # See the langfuse-web healthcheck note: 127.0.0.1, not localhost.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3030/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ".:/mnt/ddev_config"
      - "ddev-global-cache:/mnt/ddev-global-cache"

  langfuse-postgres:
    image: ${LANGFUSE_POSTGRES_IMAGE:-postgres:17}
    container_name: ddev-${DDEV_SITENAME}-langfuse-postgres
    hostname: langfuse-postgres
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"
    env_file:
      - .env.langfuse
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_DB=langfuse
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - "langfuse_postgres:/var/lib/postgresql/data"

  langfuse-clickhouse:
    image: ${LANGFUSE_CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.12}
    container_name: ddev-${DDEV_SITENAME}-langfuse-clickhouse
    hostname: langfuse-clickhouse
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"
    env_file:
      - .env.langfuse
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=langfuse
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    expose:
      - "8123"
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - "langfuse_clickhouse_data:/var/lib/clickhouse"
      - "langfuse_clickhouse_logs:/var/log/clickhouse-server"

  langfuse-redis:
    image: ${LANGFUSE_REDIS_IMAGE:-redis:7}
    container_name: ddev-${DDEV_SITENAME}-langfuse-redis
    hostname: langfuse-redis
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"
    env_file:
      - .env.langfuse
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_AUTH\""]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_AUTH\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - "langfuse_redis:/data"

  langfuse-minio:
    image: ${LANGFUSE_MINIO_IMAGE:-minio/minio:latest}
    container_name: ddev-${DDEV_SITENAME}-langfuse-minio
    hostname: langfuse-minio
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"
    env_file:
      - .env.langfuse
    environment:
      - MINIO_ROOT_USER=langfuse
    entrypoint: ["sh", "-c", 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9091" /data']
    expose:
      - "9000"
      - "9091"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - "langfuse_minio:/data"

volumes:
  langfuse_postgres:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_redis:
  langfuse_minio:
