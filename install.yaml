# Details about this file: https://ddev.readthedocs.io/en/stable/users/extend/additional-services/#sections-and-features-of-ddev-get-add-on-installyaml

name: langfuse

# ------------------------------------------------------------------
# pre_install_actions run in the context of the TARGET PROJECT ROOT.
# ------------------------------------------------------------------
pre_install_actions:
  - |
    #ddev-description:Verify openssl is available for secret generation
    if ! command -v openssl >/dev/null 2>&1; then
      echo "openssl is required to generate Langfuse secrets but was not found on the host." ;
      exit 1 ;
    fi

  - |
    #ddev-description:Generate .ddev/.env.langfuse with random secrets and dev API keys (only if it doesn't already exist)
    envfile="${DDEV_APPROOT}/.ddev/.env.langfuse"
    if [ -f "$envfile" ]; then
      echo "Reusing existing $envfile (delete it first if you want fresh secrets and a fresh admin login)."
    else
      echo "Generating $envfile with random secrets and a headless-bootstrap admin login..."
      public_key="pk-lf-$(openssl rand -hex 16 | sed -E 's/(.{8})(.{4})(.{4})(.{4})(.{12})/\1-\2-\3-\4-\5/')"
      secret_key="sk-lf-$(openssl rand -hex 16 | sed -E 's/(.{8})(.{4})(.{4})(.{4})(.{12})/\1-\2-\3-\4-\5/')"
      org_id="ddev-langfuse-org"
      project_id="ddev-langfuse-project"
      : > "$envfile"
      {
        echo "#ddev-generated-secrets"
        echo "# Auto-generated by the ddev-langfuse add-on on first install."
        echo "# Do NOT commit this file -- it is added to .ddev/.gitignore automatically."
        echo "# Delete this file and run \"ddev add-on get /path/to/ddev-langfuse\" again to rotate all secrets"
        echo "# (this wipes the Langfuse database/volumes' usefulness, since old data won't decrypt with new keys)."
        echo ""
        echo "# --- Core Langfuse secrets (docs: https://langfuse.com/self-hosting/configuration) ---"
        echo "NEXTAUTH_SECRET=$(openssl rand -base64 32)"
        echo "SALT=$(openssl rand -base64 32)"
        echo "ENCRYPTION_KEY=$(openssl rand -hex 32)"
        echo ""
        echo "# --- Datastore credentials ---"
        echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
        echo "CLICKHOUSE_PASSWORD=$(openssl rand -hex 16)"
        echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)"
        echo "REDIS_AUTH=$(openssl rand -hex 16)"
        echo ""
        echo "# --- Headless bootstrap: org / project / API keypair / admin user ---"
        echo "# These let Langfuse skip the signup wizard and boot with a ready-to-use"
        echo "# project and a valid API keypair you can paste straight into the"
        echo "# drupal/langfuse module's settings form."
        echo "LANGFUSE_INIT_ORG_ID=$org_id"
        echo "LANGFUSE_INIT_ORG_NAME=\"DDEV Local\""
        echo "LANGFUSE_INIT_PROJECT_ID=$project_id"
        echo "LANGFUSE_INIT_PROJECT_NAME=\"Local Development\""
        echo "LANGFUSE_INIT_PROJECT_PUBLIC_KEY=$public_key"
        echo "LANGFUSE_INIT_PROJECT_SECRET_KEY=$secret_key"
        echo "LANGFUSE_INIT_USER_EMAIL=admin@langfuse.ddev.site"
        echo "LANGFUSE_INIT_USER_NAME=\"DDEV Admin\""
        echo "LANGFUSE_INIT_USER_PASSWORD=$(openssl rand -hex 12)"
      } >> "$envfile"
      chmod 600 "$envfile"
    fi

  - |
    #ddev-description:Ensure the generated secrets file is never committed to the project's git repo
    gitignore="${DDEV_APPROOT}/.ddev/.gitignore"
    touch "$gitignore"
    grep -qxF '.env.langfuse' "$gitignore" || echo '.env.langfuse' >> "$gitignore"

# ------------------------------------------------------------------
# Files copied into the target project's .ddev/ directory.
# Each contains "#ddev-generated" so a later `ddev add-on get` can
# safely refresh them if the user hasn't hand-edited them.
# ------------------------------------------------------------------
project_files:
  - docker-compose.langfuse.yaml
  - .env.langfuse.example
  - commands/host/langfuse
  - commands/host/langfuse-credentials

global_files:

ddev_version_constraint: '>= v1.24.10'

dependencies:

# ------------------------------------------------------------------
# post_install_actions run in the context of the target project's
# .ddev/ directory.
# ------------------------------------------------------------------
post_install_actions:
  - chmod +x commands/host/langfuse commands/host/langfuse-credentials

  - |
    #ddev-description:Print the generated Langfuse credentials
    envfile="./.env.langfuse"
    if [ -f "$envfile" ]; then
      # shellcheck disable=SC1090
      set -a; . "$envfile"; set +a
      echo ""
      echo "======================================================================"
      echo " Langfuse is configured and ready. Run 'ddev restart' to start it."
      echo "======================================================================"
      echo " Web UI (from host browser): ddev launch :3000   (or: ddev langfuse)"
      echo " Web UI (from other DDEV containers, e.g. Drupal web): http://langfuse-web:3000"
      echo ""
      echo " Admin login"
      echo "   Email:    ${LANGFUSE_INIT_USER_EMAIL}"
      echo "   Password: ${LANGFUSE_INIT_USER_PASSWORD}"
      echo ""
      echo " API keypair (already bootstrapped into the '${LANGFUSE_INIT_PROJECT_NAME}' project)"
      echo "   Public key: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}"
      echo "   Secret key: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}"
      echo ""
      echo " For the Drupal 'langfuse' module settings form, use:"
      echo "   langfuse_url:        http://langfuse-web:3000"
      echo "   auth_method:         key_pair"
      echo "   key_pair.public_key: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}"
      echo "   key_pair.secret_key: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}"
      echo ""
      echo " Run 'ddev langfuse-credentials' any time to see this again."
      echo "======================================================================"
    fi

# ------------------------------------------------------------------
# removal_actions run in the context of the target project's .ddev/
# directory. Files listed in project_files with #ddev-generated are
# removed automatically; this only handles the extras.
# ------------------------------------------------------------------
removal_actions:
  - |
    #ddev-description:Remind the user how to fully clean up Langfuse data and secrets
    echo ""
    echo "The langfuse add-on has been removed."
    echo "Docker volumes and .env.langfuse (containing secrets/API keys) were left in place in case you want to reinstall later."
    echo "To fully wipe Langfuse's local data, also run:"
    echo "  rm -f .env.langfuse"
    echo "  docker volume rm \$(docker volume ls -q --filter label=com.docker.compose.project=ddev-\${DDEV_SITENAME} --filter name=langfuse) 2>/dev/null"

yaml_read_files:
